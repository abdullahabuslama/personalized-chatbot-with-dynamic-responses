<!DOCTYPE html>
<html>
<head>
    <title>ASK A QUESTION!!</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            background-color: #f7f9fc;
            color: #333;
            line-height: 1.6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .answer-box {
            background: #eaf2f8;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #3498db;
            white-space: pre-wrap;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Medicine RAG System</h1>

    <form action="/ask" method="post">
        <label for="query">Ask a medicine question:</label><br>
        <textarea id="query" name="query" placeholder="Type your medicine question here...">{{ query if query else "" }}</textarea><br>
        <button type="submit">Ask</button>
    </form>

    {% if answer %}
    <div class="answer-box" id="answer">
        <h2>Answer:</h2>
        <pre>{{ answer }}</pre>
    </div>
    {% endif %}

    <script>
        // Auto-resize textarea as user types
        const textarea = document.getElementById('query');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Scroll to answer automatically when page reloads
        window.onload = function() {
            const answerDiv = document.getElementById('answer');
            if(answerDiv) {
                answerDiv.scrollIntoView({ behavior: 'smooth' });
            }
        };
    </script>
</body>
</html>
